name: Build and Release FrameAI APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Ensure gradlew is executable
      run: chmod +x gradlew

    - name: Create debug keystore for CI signing
      run: |
        if [ ! -f debug.keystore ]; then
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Build APK with Gradle
      run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

    - name: Rename APK for installation
      run: |
        mkdir -p release-output
        cp app/build/outputs/apk/debug/app-debug.apk release-output/FrameAI.apk

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FrameAI-APK
        path: release-output/FrameAI.apk

    - name: Create GitHub Release with direct APK download
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.0.0
        name: FrameAI v1.0.0 - Installable Android APK
        body: |
          ### 📱 Direct Phone Installation
          Tap **`FrameAI.apk`** below under **Assets** to download and install FrameAI on your Android phone!
        draft: false
        prerelease: false
        files: |
          release-output/FrameAI.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
