name: Build and Release FrameAI APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FrameAI-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release with direct APK download
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: latest
        name: FrameAI Latest Installable APK
        body: |
          ### Download & Install on your Phone
          Tap **`FrameAI.apk`** below under **Assets** to download and install FrameAI directly on your Android phone!
        draft: false
        prerelease: false
        files: |
          app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
